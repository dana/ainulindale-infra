apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tmtrack
  namespace: argocd
  labels:
    app.kubernetes.io/name: tmtrack
    app.kubernetes.io/instance: tmtrack
    app.kubernetes.io/part-of: tmtrack
spec:
  project: ainulindale
  source:
    repoURL: https://github.com/dana/ainulindale-infra.git
    targetRevision: main
    path: apps/tmtrack/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: tmtrack
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
