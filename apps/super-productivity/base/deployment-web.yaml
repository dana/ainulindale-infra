apiVersion: apps/v1
kind: Deployment
metadata:
  name: super-productivity-web
  namespace: super-productivity
  labels:
    app.kubernetes.io/name: super-productivity
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: super-productivity
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: super-productivity
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: super-productivity
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: docker.io/johannesjo/super-productivity:v20.1.0@sha256:6592ab5929bad174260cdc07b30c9c9b8943c7dba82596eddcb6a75d439d1756
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
