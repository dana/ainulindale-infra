apiVersion: batch/v1
kind: Job
metadata:
  name: super-productivity-migration-v20-1-0
  namespace: super-productivity
  labels:
    app.kubernetes.io/name: super-productivity
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: super-productivity
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: super-productivity
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/super-productivity/supersync:v20.1.0@sha256:ed76d4b4655e09afa58e8bb510742db96143c18e56f4855c53ed6e7d45e9060a
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for postgres to accept connections..."
              until nc -z -w 2 postgres 5432; do
                sleep 2
              done
              echo "Postgres is reachable. Running migrations..."
              sh scripts/migrate-deploy.sh
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: super-productivity-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
