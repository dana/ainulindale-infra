apiVersion: v1
kind: Service
metadata:
  name: tmtrack-api
  namespace: tmtrack
  labels:
    app.kubernetes.io/name: tmtrack
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tmtrack
spec:
  type: ClusterIP
